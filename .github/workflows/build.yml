name: Build

on:
  push:
    branches: [ master ]
    paths:
    - src/**
    - include/**
    - .github/workflows/build.yml
    - CMakeLists.txt
    - CMakePresets.json
    - Makefile
  pull_request:
    branches: [ master ]
    paths:
    - src/**
    - include/**
    - .github/workflows/build.yml
    - CMakeLists.txt
    - CMakePresets.json
    - Makefile

jobs:
  build:
    name: ${{ matrix.os }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y xorg-dev libglu1-mesa-dev ninja-build

    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      run: |
        brew install ninja

    - name: Install Windows dependencies
      if: runner.os == 'Windows'
      run: |
        choco install ninja

    - name: Configure CMake
      run: cmake --preset=${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}

    - name: Build
      run: cmake --build build/${{ matrix.build_type == 'Debug' && 'debug' || 'release' }} --parallel

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: glfw-skeleton-${{ matrix.os }}-${{ matrix.build_type }}
        path: |
          build/${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}/bin/
          build/${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}/shaders/
